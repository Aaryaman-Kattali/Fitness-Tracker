name: fitness_tracker
description: "Single-user, offline-first fitness tracker with an iOS visual language."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_map: ^8.3.1
  # Pinned exactly, no caret, for tracelet's reason rather than out of caution:
  # 0.1.0 to 2.8.1 with two breaking majors, and 2.8.1 was five days old when it
  # was adopted. A package still moving that fast is not one to let float into a
  # build nobody re-tested on a device that day.
  #
  # It adds NO transitive packages: flutter_map, latlong2, http, meta,
  # path_provider and characters are all already here, and its meta ^1.11.0
  # clears the 1.17.0 ceiling that tracelet's ^1.18.0 hit.
  flutter_map_vector_tiles: 2.8.1
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  health: ^13.3.2
  intl: ^0.20.2
  latlong2: ^0.10.1
  meta: ^1.16.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.0
  # The barometer, for A6 elevation gain. tracelet 3.2.17 never reads
  # TYPE_PRESSURE. Checked with a dry run before adding: it resolves under the
  # meta 1.17.0 pin that holds tracelet at 3.2.17 and adds exactly two
  # packages, itself and its platform interface. Only SensorsPlusBarometer
  # imports it.
  sensors_plus: ^7.1.0
  # Debug-only in use, NOT debug-only in the binary, and that trade was made
  # knowingly. The export section is `kDebugMode`-gated, but a plugin is not:
  # share_plus registers through the Flutter plugin machinery and merges its
  # own FileProvider into every AndroidManifest, release included, where
  # nothing will ever call it. This is the first dependency carried for a
  # feature the user never sees. It is here because the alternative is
  # `adb exec-out run-as` on the most valuable artifact in the project, and a
  # capture that needs a PC to retrieve is a capture that does not get taken.
  share_plus: ^13.3.0
  sqlite3_flutter_libs: ^0.5.42
  timezone: ^0.11.1
  # Pinned exactly, no caret. tracelet shipped 3.6.9 through 3.8.7 in 26 days;
  # a package releasing every day or two on an unsettled API is not one to let
  # float into a build nobody re-tested on a device that day.
  #
  # 3.2.17 and not the current 3.8.7 for a hard reason, not caution: every
  # tracelet from 3.2.18 onward requires meta ^1.18.0, and the Flutter SDK
  # here (3.41.7) pins meta to 1.17.0 through flutter_test. 3.8.7 does not
  # resolve at all. Moving to it means upgrading the Flutter toolchain, which
  # is a decision about the whole app rather than about this feature.
  # 3.2.17 has the OEM power-management APIs this milestone needs.
  tracelet: 3.2.17

dev_dependencies:
  build_runner: ^2.10.1
  drift_dev: ^2.28.2
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.0
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    # The basemap style document, vendored. Fetched from OpenFreeMap on
    # 7 Sep 2026 and recoloured to this app's palette on 8 Sep, so it is no
    # longer byte-identical to anything upstream and cannot be re-fetched
    # without redoing the palette. One document, not two: the map does not
    # follow the appearance setting. See NOTES.md for what owning this costs.
    - assets/map_style/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
